[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uskladjenost-cijena"
version = "1.0.1"
description = "Python SDK for the Usklađenost cijena API (uskladjenost-cijena.com): anchor prices and public price lists under NN 101/2026."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Info Media d.o.o.", email = "support@info-media.it" }]
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]
keywords = ["uskladjenost-cijena", "sidrena-cijena", "cjenik", "nn-101-2026", "price-compliance", "croatia"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]

[project.optional-dependencies]
dev = ["pytest>=7", "responses>=0.23"]

[project.urls]
Homepage = "https://uskladjenost-cijena.com"
Documentation = "https://uskladjenost-cijena.com/api/docs"

[tool.setuptools.packages.find]
include = ["uskladjenost_cijena*"]
